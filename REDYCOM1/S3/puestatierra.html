<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Puesta a Tierra y Unión – Maqueta 3D con Realidad Aumentada</title>
<style>
:root{--bg:#0b1220;--tx:#e2e8f0;--dim:#94a3b8;--ln:rgba(148,163,184,.2)}
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);overflow:hidden}
#app{display:flex;height:100%;width:100%}
#stage{position:relative;flex:1;min-width:0;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#1b2740 0%,#111b2e 55%,#0b1220 100%);touch-action:none}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#stage.ar{background:#000}#stage.ar #cam{display:block}#stage.ar .grid{display:none}
#svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#svg.drag{cursor:grabbing}
#svg text{font-family:Arial,Helvetica,sans-serif;pointer-events:none}
.fx{position:absolute;inset:0;pointer-events:none}
.grid{background-image:linear-gradient(rgba(148,163,184,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.05) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(ellipse at 50% 55%,#000 25%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 55%,#000 25%,transparent 75%)}
.corner{position:absolute;width:22px;height:22px;border:2px solid rgba(148,163,184,.45);pointer-events:none}
.tl{top:10px;left:10px;border-right:0;border-bottom:0}.tr{top:10px;right:10px;border-left:0;border-bottom:0}
.bl{bottom:10px;left:10px;border-right:0;border-top:0}.br{bottom:10px;right:10px;border-left:0;border-top:0}
#title{position:absolute;top:18px;left:26px;pointer-events:none}
#title h1{margin:0;font-size:16px;letter-spacing:1.5px;color:#f1f5f9}
#title p{margin:4px 0 0;font-size:12px;color:var(--dim)}
#badge{position:absolute;top:16px;right:26px;font-size:11px;color:#34d399;background:rgba(15,23,42,.7);border:1px solid rgba(52,211,153,.35);padding:4px 10px;border-radius:999px;pointer-events:none}
#readout{position:absolute;left:26px;bottom:150px;font-size:11px;color:var(--dim);pointer-events:none;line-height:1.5}
#toolbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;width:96%;z-index:5}
.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.btn{background:rgba(15,23,42,.88);color:#cbd5e1;border:1px solid rgba(148,163,184,.25);border-radius:8px;padding:7px 10px;font-size:12px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35);backdrop-filter:blur(6px)}
.btn:hover{background:rgba(51,65,85,.95);color:#fff}
.btn.on{background:#2563eb;border-color:#3b82f6;color:#fff;box-shadow:0 2px 10px rgba(37,99,235,.45)}
#toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);max-width:88%;background:rgba(15,23,42,.96);border:1px solid rgba(148,163,184,.3);color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:9;text-align:center}
#toast.show{opacity:1}
#pop{position:absolute;left:0;top:0;width:330px;max-width:calc(100% - 16px);background:rgba(15,23,42,.97);border:1px solid rgba(148,163,184,.3);border-top:3px solid var(--c);border-radius:10px;box-shadow:0 16px 44px rgba(0,0,0,.6);z-index:7;display:none;font-size:13px;line-height:1.45}
#pop.show{display:block}
.ph{display:flex;align-items:center;gap:9px;padding:10px 10px 8px 12px;cursor:move;touch-action:none;border-bottom:1px solid var(--ln)}
.ph b{flex:1;font-size:13.5px;color:#f8fafc;line-height:1.3}
.pn{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:bold;font-size:12px;border:1.5px solid var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.px{flex:none;background:transparent;border:0;color:#94a3b8;font-size:20px;line-height:1;cursor:pointer;padding:0 4px}
.px:hover{color:#fff}
.pb{padding:4px 12px 12px;overflow:auto;max-height:min(52vh,430px)}
.pb p{margin:2px 0 4px;color:#dbe4ee}
.tagb{display:inline-block;font-size:10px;letter-spacing:.5px;padding:2px 6px;border-radius:4px;margin:9px 0 3px;border:1px solid}
.b1{color:#7fb2f0;border-color:#3b6ea8}.b2{color:#e0a458;border-color:#8a6430}.b3{color:#b9c6d0;border-color:#8798a6}
#panel{width:350px;flex:none;background:#0f172a;border-left:1px solid var(--ln);display:flex;flex-direction:column;min-height:0}
#detail{padding:14px 14px 8px;overflow-y:auto;max-height:50%;flex:none;border-bottom:1px solid var(--ln);font-size:13px;line-height:1.45}
#detail h2{margin:0 0 8px;font-size:15px;color:#f8fafc}
#detail ul{padding-left:18px;margin:6px 0}#detail li{margin:5px 0}
#detail small{color:var(--dim);display:block;margin-top:8px;font-size:11px}
.leg{display:grid;grid-template-columns:34px 1fr;gap:5px 8px;align-items:center;margin:8px 0;font-size:12px}
.leg i{display:block;height:0;border-top:3px solid}
#listwrap{overflow-y:auto;padding:8px 12px 14px;flex:1;min-height:0}
#listwrap h3{margin:4px 0 6px;font-size:12px;letter-spacing:1.5px;color:var(--dim)}
.it{display:flex;gap:9px;align-items:center;padding:6px 8px;border:1px solid rgba(148,163,184,.14);border-radius:7px;margin:4px 0;cursor:pointer;font-size:13px;background:rgba(255,255,255,.03)}
.it:hover{background:rgba(255,255,255,.07)}
.it .n{flex:none;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;font-weight:bold;font-size:12px;border:1.5px solid var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.it.sel{background:rgba(255,255,255,.09);border-color:var(--c)}
@media (max-width:860px){
 #app{flex-direction:column}
 #panel{width:100%;height:36%;border-left:0;border-top:1px solid var(--ln)}
 #detail{max-height:45%}
 #title h1{font-size:12px}#title p,#readout{display:none}
 .btn{padding:5px 7px;font-size:11px}
 #pop{width:min(300px,calc(100% - 16px))}
}
</style>
</head>
<body>
<div id="app">
 <div id="stage">
  <video id="cam" playsinline muted></video>
  <div class="fx grid"></div>
  <svg id="svg" xmlns="http://www.w3.org/2000/svg">
   <defs>
    <filter id="sh" x="-10%" y="-10%" width="125%" height="130%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".38"/></filter>
    <filter id="sh2" x="-40%" y="-40%" width="180%" height="190%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".5"/></filter>
   </defs>
   <g id="scene" filter="url(#sh)"></g>
   <g id="overlay"></g>
  </svg>
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <div id="title"><h1>PUESTA A TIERRA Y UNIÓN · EDIFICIO DE 3 NIVELES</h1><p>Maqueta 3D interactiva · Realidad aumentada · toque un número</p></div>
  <div id="badge">● RA HOLOGRÁFICA</div>
  <div id="readout"></div>
  <div id="pop"></div>
  <div id="toolbar">
   <div class="row">
    <button class="btn" data-v="iso">Isométrica</button>
    <button class="btn" data-v="front">Frontal</button>
    <button class="btn" data-v="top">Planta</button>
    <button class="btn" data-v="right">Lado derecho</button>
    <button class="btn" data-v="left">Lado izquierdo</button>
    <button class="btn" data-v="earth">Electrodos</button>
   </div>
   <div class="row">
    <button class="btn" data-l="3">Todas las plantas</button>
    <button class="btn" data-l="0">Planta baja</button>
    <button class="btn" data-l="1">Hasta piso 2</button>
    <button class="btn" data-l="2">Hasta piso 3</button>
   </div>
   <div class="row">
    <button class="btn" data-a="auto">Auto-giro</button>
    <button class="btn" data-a="dims">Niveles</button>
    <button class="btn" data-a="flow">Corriente</button>
    <button class="btn" data-a="labels">Etiquetas</button>
    <button class="btn" data-a="shadow">Sombras</button>
    <button class="btn" data-a="ar">Cámara AR</button>
    <button class="btn" data-a="gyro" id="bgyro">Giroscopio</button>
    <button class="btn" data-a="zout">−</button>
    <button class="btn" data-a="zin">+</button>
    <button class="btn" data-a="reset">Restablecer</button>
   </div>
  </div>
  <div id="toast"></div>
 </div>
 <aside id="panel">
  <div id="detail"></div>
  <div id="listwrap"><h3>COMPONENTES · TOQUE PARA ABRIR SU VENTANA</h3><div id="list"></div></div>
 </aside>
</div>

<script>
(()=>{
'use strict';
const NS='http://www.w3.org/2000/svg';
const $=s=>document.querySelector(s);
const stage=$('#stage'),svg=$('#svg'),sceneG=$('#scene'),ovG=$('#overlay'),vid=$('#cam'),pop=$('#pop');
let W=800,H=600;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- paleta sobria ---------- */
const COP='#e08f5f';
const C={wall:'#8fa8c4',slab:'#94a3b8',steel:'#64748b',cu:COP,busbar:'#475569',pbb:'#f0b27a',entry:'#9cc7f0',service:'#7fdcb8',sbb:'#f2c14e',panel:'#cbd5e1',room:'#6ea8fe',tray:'#a58df0',tbc:'#f5c6a5',earth:'#6bbf7a',gec:'#f0707f',dim:'#cbd5e1'};
const BG=[15,23,42];
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];

/* ---------- estado ---------- */
const st={dims:true,flow:true,labels:false,shadow:true,auto:true,level:3};
const HOME={yaw:.6,pitch:.35,zoom:.95,px:0,py:-30,tx:0,ty:4,tz:.8};
const cam=Object.assign({D:32},HOME);
const tgt=Object.assign({},HOME);
let T=0,sel=null,hov=null,dragging=false,popOff={x:0,y:0},popW=330,popH=300;
const FH=3.4,Y=k=>k*FH,LY=k=>3+2*k;

/* ---------- primitivas ---------- */
const items=[],labels=[];
const mk=(t,a)=>{const e=document.createElementNS(NS,t);if(a)for(const k in a)e.setAttribute(k,a[k]);return e};
function reg(o,el){o.el=el;o._a={};sceneG.appendChild(el);items.push(o);return o}
function setA(o,k,v){if(o._a[k]!==v){o._a[k]=v;o.el.setAttribute(k,v)}}
function addPoly(o){o.type='poly';o.layer=o.layer??3;o.k=o.k??.12;o.op=o.op??1;o.sw=(o.sw??1)*.85;o.so=o.so??.9;o.sub=o.sub||0;o.rgb=hex(o.c);return reg(o,mk('polygon',{'stroke-linejoin':'round'}))}
function addLine(o){o.type='line';o.layer=o.layer??3;o.sw=o.sw??1.5;o.so=o.so??.9;o.sub=o.sub||0;return reg(o,mk('path',{fill:'none','stroke-linecap':'round','stroke-linejoin':'round'}))}
function addDot(o){o.type='dot';o.layer=o.layer??3;o.sub=o.sub||0;return reg(o,mk('circle',{}))}
function addLabel(o){o.el=mk('text',{'text-anchor':'middle','font-size':12,fill:o.c||C.dim,stroke:'#0b1220','stroke-width':3,'paint-order':'stroke'});o.el.textContent=o.text;ovG.insertBefore(o.el,ovG.firstChild);labels.push(o);return o}
function addBox(x0,x1,y0,y1,z0,z1,o){
 const F=[
  {n:[1,0,0],p:[[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]},
  {n:[-1,0,0],p:[[x0,y0,z1],[x0,y1,z1],[x0,y1,z0],[x0,y0,z0]]},
  {n:[0,1,0],p:[[x0,y1,z0],[x0,y1,z1],[x1,y1,z1],[x1,y1,z0]]},
  {n:[0,-1,0],p:[[x0,y0,z1],[x0,y0,z0],[x1,y0,z0],[x1,y0,z1]]},
  {n:[0,0,1],p:[[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]},
  {n:[0,0,-1],p:[[x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0]]}];
 F.forEach((f,i)=>{const s=o.face?o.face(i):{};if(s===false)return;const p=Object.assign({},o,s,{pts:f.p,n:f.n});delete p.face;addPoly(p)});
}
function rectPts(c,u,v,w,h){const a=w/2,b=h/2;return [[-1,-1],[1,-1],[1,1],[-1,1]].map(([s,t])=>[c[0]+u[0]*s*a+v[0]*t*b,c[1]+u[1]*s*a+v[1]*t*b,c[2]+u[2]*s*a+v[2]*t*b])}
const plate=(c,u,v,w,h,n,o)=>addPoly(Object.assign({pts:rectPts(c,u,v,w,h),n},o));
function crom(P,s=5){const out=[],n=P.length;for(let i=0;i<n-1;i++){const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(n-1,i+2)];for(let j=0;j<s;j++){const t=j/s,t2=t*t,t3=t2*t;out.push([0,1,2].map(k=>.5*(2*p1[k]+(-p0[k]+p2[k])*t+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*t3)))}}out.push(P[n-1]);return out}
const UP=[0,1,0];

/* conductor de cobre (+ flujo animado opcional, de la fuente hacia tierra) */
function cu(k,pts,o={}){
 const P=o.smooth===false?pts:crom(pts,5),tag=o.tag||'bbc';
 addLine({pts:P,c:o.c||COP,sw:o.sw||3.2,so:.95,dash:o.dash,fl:k,layer:LY(k)+.6,tag});
 if(o.flow)addLine({pts:P,c:'#ffe7cf',sw:1.5,so:.95,dash:'4 12',flow:true,speed:o.flow,group:'flow',fl:k,layer:LY(k)+.7,tag});
}

/* =====================  ESCENA  ===================== */
function rack(k,xc,zc,ax,dir,li){
 const y0=Y(k),hx=ax==='z'?.3:.45,hz=ax==='z'?.45:.3,dp=[xc,y0+1.05,zc];
 const o={fl:k,layer:LY(k),tag:'room',dp};
 addBox(xc-hx,xc+hx,y0,y0+2.1,zc-hz,zc+hz,Object.assign({c:'#64748b',k:.14,sw:1.2,so:.95,face:i=>i===3?false:{}},o));
 const f=(a,y,off)=>ax==='z'?[xc+a,y0+y,zc+dir*(hz+off)]:[xc+dir*(hx+off),y0+y,zc+a];
 const nf=ax==='z'?[0,0,dir]:[dir,0,0];
 [[.2,.2,'#4cc9a0'],[.5,.16,'#5bc0eb'],[.75,.3,'#6ea8fe'],[1.2,.16,'#5bc0eb'],[1.5,.4,'#e8c547']].forEach(([y,h,c],i)=>{
  addPoly(Object.assign({pts:[f(-.25,y,.003),f(.25,y,.003),f(.25,y+h,.003),f(-.25,y+h,.003)],n:nf,c,k:.3,sw:.8,so:.8,sub:1},o));
  if(i===1||i===3)for(let j=0;j<4;j++)addDot(Object.assign({p:f(-.15+j*.1,y+h/2,.006),r:.012,c:'#4cc9a0',n:nf,blink:{sp:2+(i+j+li)%4,ph:j+i},sub:3},o));
 });
}
function tray(k,x0,x1,z){
 const y=Y(k)+2.8,o={fl:k,layer:LY(k)+.2,tag:'tray'};
 [-.22,.22].forEach(d=>addLine(Object.assign({pts:[[x0,y,z+d],[x1,y,z+d]],c:'#cbd5e1',sw:1.8,so:.9},o)));
 for(let x=x0;x<=x1+.01;x+=.5)addLine(Object.assign({pts:[[x,y,z-.22],[x,y,z+.22]],c:'#cbd5e1',sw:1,so:.55},o));
 [x0,(x0+x1)/2,x1].forEach(x=>addLine(Object.assign({pts:[[x,y,z],[x,y+.3,z]],c:'#cbd5e1',sw:1,so:.4},o)));
}
function panels(k,zs){
 const y0=Y(k);
 zs.forEach(z=>{
  const dp=[3.76,y0+1.5,z],o={fl:k,layer:LY(k)-.3,tag:'panelb',dp};
  addBox(3.72,3.8,y0+1.2,y0+1.85,z-.18,z+.18,Object.assign({c:C.panel,k:.4,sw:1.1,so:1,face:i=>i===1?{ghost:true}:i===3?false:{}},o));
  plate([3.718,y0+1.52,z],[0,0,1],UP,.28,.5,[-1,0,0],Object.assign({c:C.panel,k:.12,sw:.9,so:.7,sub:1},o));
  addDot(Object.assign({p:[3.716,y0+1.45,z+.1],r:.02,c:'#94a3b8',n:[-1,0,0],sub:2},o));
 });
}
function sbb(k){
 const y0=Y(k),dp=[3.77,y0+2.33,-1.5],o={fl:k,layer:LY(k)-.3,tag:'sbb',dp};
 addBox(3.72,3.8,y0+2.3,y0+2.36,-2.5,-.5,Object.assign({c:C.sbb,k:.8,sw:1.2,so:1,face:i=>i===1?{ghost:true}:i===3?false:{}},o));
 [-2.3,-1.5,-.7].forEach(z=>addBox(3.75,3.8,y0+2.26,y0+2.4,z-.03,z+.03,Object.assign({c:'#94a3b8',k:.5,sw:.8,so:.9,sub:1,face:i=>i===3?false:{}},o)));
}

function build(){
 /* base del modelo */
 addPoly({pts:[[-7,-2.7,-5],[-7,-2.7,8],[7,-2.7,8],[7,-2.7,-5]],n:UP,c:C.wall,k:.05,sw:1,so:.3,layer:-1});

 /* terreno: corte de suelo con electrodos */
 const soilFace=i=>i===3?false:i===2?{c:'#6b9c5a',k:.55,op:.9,layer:1.3,sw:1}:{c:'#8a6a4f',k:.6,op:.5,layer:1.2,sw:1};
 addBox(-3.2,-.4,-2.6,0,3,6,{c:'#8a6a4f',k:.6,sw:1.1,so:.9,tag:'earth',face:soilFace});
 [-.8,-1.6].forEach(y=>{
  addLine({pts:[[-3.2,y,6.005],[-.4,y,6.005]],n:[0,0,1],c:'#6b4f3a',sw:1,so:.55,layer:1.25});
  addLine({pts:[[-3.205,y,3],[-3.205,y,6]],n:[-1,0,0],c:'#6b4f3a',sw:1,so:.55,layer:1.25});
 });
 const eo={layer:2.2,tag:'earth'};
 const ring=[[-2.8,-.8,3.6],[-.8,-.8,3.6],[-.8,-.8,5.3],[-2.8,-.8,5.3],[-2.8,-.8,3.6]];
 addLine(Object.assign({pts:ring,c:COP,sw:2.6,so:.95},eo));
 [[-2.6,4.5],[-1.0,4.5],[-1.8,5.3]].forEach(([x,z])=>{
  addLine(Object.assign({pts:[[x,-.8,z],[x,-2.45,z]],c:'#d9a07a',sw:4,so:.95},eo));
  addDot(Object.assign({p:[x,-2.45,z],r:.07,c:'#d9a07a'},eo));
  addLine(Object.assign({pts:[[x,-.8,z],[x,-.8,z+.001]],c:'#fff',sw:1,so:0},eo));
 });
 addBox(-2.3,-1.3,-2.3,-2.26,3.9,4.7,Object.assign({c:COP,k:.8,sw:1.2,so:1,face:i=>i===3?false:{}},eo));

 /* losas (translúcidas) y muros por nivel */
 const slab=k=>addBox(-4,4,Y(k)-.3,Y(k),-3,3,{fl:k,c:C.slab,k:.3,sw:1.1,so:.9,tag:'slab',face:i=>i===3?false:i===2?{op:k===3?.08:.4,layer:k===3?8:2+2*k}:{op:k===3?.08:.9,layer:k===3?8:2+2*k}});
 [0,1,2,3].forEach(slab);
 const wall=(k,x0,x1,z0,z1,inner)=>addBox(x0,x1,Y(k),Y(k+1)-.3*(k<2?0:1),z0,z1,{fl:k,layer:1,c:C.wall,k:.12,sw:1.2,so:.85,tag:'wall',face:i=>i===inner?{}:i===3?false:i===2?(k<2?false:{layer:9,op:.14,k:.3}):{layer:9,op:.06,k:.15,sw:.9,so:.5}});
 for(let k=0;k<3;k++){wall(k,-4,4,-3,-2.8,4);wall(k,-4,-3.8,-2.8,2.8,0);wall(k,3.8,4,-2.8,2.8,1);wall(k,-4,4,2.8,3,5)}

 /* columna de metal estructural y vigas (negras) */
 for(let k=0;k<3;k++){
  const y0=Y(k);
  addBox(-.65,-.15,y0-(k?0:.3),Y(k+1),.35,.85,{fl:k,layer:LY(k)+.1,c:C.steel,k:.4,sw:1.3,so:1,tag:'steel',dp:[-.4,y0+1.7,.6],face:i=>i===3?false:{}});

const near=(cur,a)=>a+Math.round((cur-a)/(Math.PI*2))*Math.PI*2;
function levelTarget(){
 const l=st.level;
 Object.assign(tgt,{tx:0,ty:l===3?4:Y(l)+1.6,tz:.8,px:0,py:-30,zoom:l===3?.95:(l===0?1.6:1.5)});
}
function setLevel(l,silent){st.level=l;syncBtns();if(!silent&&!sel)levelTarget()}
function select(h){
 sel=h;st.auto=false;
 HS.forEach(x=>x.li.classList.toggle('sel',x===h));
 if(h){
  if(h.fl>st.level)setLevel(3,true);
  tgt.tx=h.a[0];tgt.ty=h.a[1];tgt.tz=h.a[2];tgt.px=0;tgt.py=-10;
  if(h.n){tgt.zoom=2.5;if(Math.abs(h.n[1])>.5)tgt.pitch=1.1;else{tgt.yaw=near(cam.yaw,Math.atan2(-h.n[0],h.n[2]));tgt.pitch=.3}}
  else{tgt.zoom=2.3;tgt.pitch=.4}
  openPop(h);
 }else{levelTarget();closePop()}
 syncBtns();
}

function syncBtns(){
 document.querySelectorAll('[data-a]').forEach(b=>{const a=b.dataset.a;let on=false;if(a in st)on=st[a];if(a==='ar')on=stage.classList.contains('ar');if(a==='gyro')on=gyro;b.classList.toggle('on',on)});
 document.querySelectorAll('[data-l]').forEach(b=>b.classList.toggle('on',+b.dataset.l===st.level));
 sceneG.setAttribute('filter',st.shadow?'url(#sh)':'none');
}
async function toggleAR(){
 if(stage.classList.contains('ar')){stopAR();return}
 try{
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('sin API');
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  vid.srcObject=stream;await vid.play();
  stage.classList.add('ar');$('#badge').textContent='● RA CÁMARA ACTIVA';
  toast('Realidad aumentada activa: la maqueta flota sobre la imagen de su cámara. Arrastre para rotarla o use el giroscopio.');
 }catch(e){toast('No se pudo abrir la cámara (permiso denegado o dispositivo sin cámara). Abra el archivo en el navegador de su teléfono o PC y acepte el permiso; mientras tanto se mantiene el modo holográfico.',7000)}
 syncBtns();
}
function stopAR(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}vid.srcObject=null;stage.classList.remove('ar');$('#badge').textContent='● RA HOLOGRÁFICA';syncBtns()}
function onOri(e){
 if(e.alpha==null)return;g0=g0===null?e.alpha:g0;gTimer=1;
 const y=gBase-(e.alpha-g0)*Math.PI/180,p=clamp((90-(e.beta??45))*Math.PI/180,.05,1.5);
 cam.yaw=tgt.yaw=y;cam.pitch=tgt.pitch=p;
}
async function toggleGyro(){
 if(gyro){gyro=false;window.removeEventListener('deviceorientation',onOri);syncBtns();return}
 try{
  if(typeof DeviceOrientationEvent==='undefined')throw 0;
  if(typeof DeviceOrientationEvent.requestPermission==='function'){const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted')throw 0}
  gyro=true;g0=null;gTimer=0;gBase=cam.yaw;st.auto=false;window.addEventListener('deviceorientation',onOri);
  setTimeout(()=>{if(gyro&&!gTimer){toast('Este dispositivo no entrega datos de giroscopio (normal en PC). Use el arrastre para rotar.');gyro=false;window.removeEventListener('deviceorientation',onOri);syncBtns()}},1500);
  toast('Giroscopio activo: mueva el dispositivo para rodear la maqueta.');
 }catch(e){toast('Giroscopio no disponible o permiso denegado.')}
 syncBtns();
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.classList.contains('px'))return;
 if(b.dataset.v){view(b.dataset.v);return}
 if(b.dataset.l!==undefined){select(null);setLevel(+b.dataset.l);return}
 const a=b.dataset.a;if(!a)return;
 if(a in st){st[a]=!st[a];if(a==='auto'&&st.auto)select(null)}
 else if(a==='ar')toggleAR();
 else if(a==='gyro')toggleGyro();
 else if(a==='zin')tgt.zoom=clamp(tgt.zoom*1.3,.35,7);
 else if(a==='zout')tgt.zoom=clamp(tgt.zoom/1.3,.35,7);
 else if(a==='reset'){select(null);st.level=3;levelTarget();Object.assign(tgt,{yaw:near(cam.yaw,HOME.yaw),pitch:HOME.pitch});st.auto=false}
 syncBtns();
});
if(!('DeviceOrientationEvent' in window))$('#bgyro').style.display='none';

/* ---------- puntero ---------- */
const ptrs=new Map();let panMode=false,lastPinch=0,lastMid=null;
const syncTgt=()=>{tgt.yaw=cam.yaw;tgt.pitch=cam.pitch;tgt.zoom=cam.zoom;tgt.px=cam.px;tgt.py=cam.py};
svg.addEventListener('pointerdown',e=>{
 if(e.target.closest('.hs'))return;
 svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});dragging=true;svg.classList.add('drag');
 panMode=e.button===2||e.shiftKey||e.ctrlKey;
 if(ptrs.size===2){const [a,b]=[...ptrs.values()];lastPinch=Math.hypot(a.x-b.x,a.y-b.y)||1;lastMid={x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
});
svg.addEventListener('pointermove',e=>{
 const p=ptrs.get(e.pointerId);if(!p)return;
 const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
 if(ptrs.size===1){if(panMode){cam.px+=dx;cam.py+=dy}else{cam.yaw+=dx*.008;cam.pitch=clamp(cam.pitch+dy*.006,.04,1.52)}}
 else if(ptrs.size===2){const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y)||1,mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};cam.zoom=clamp(cam.zoom*d/lastPinch,.35,7);lastPinch=d;cam.px+=mid.x-lastMid.x;cam.py+=mid.y-lastMid.y;lastMid=mid}
 syncTgt();
});
const endP=e=>{ptrs.delete(e.pointerId);if(!ptrs.size){dragging=false;svg.classList.remove('drag')}};
svg.addEventListener('pointerup',endP);svg.addEventListener('pointercancel',endP);
svg.addEventListener('wheel',e=>{e.preventDefault();cam.zoom=clamp(cam.zoom*Math.exp(-e.deltaY*.0016),.35,7);tgt.zoom=cam.zoom},{passive:false});
svg.addEventListener('contextmenu',e=>e.preventDefault());
svg.addEventListener('dblclick',e=>{if(e.target.closest('.hs'))return;select(null);st.level=3;levelTarget();Object.assign(tgt,{yaw:near(cam.yaw,HOME.yaw),pitch:HOME.pitch});syncBtns()});
window.addEventListener('keydown',e=>{
 const k=e.key;
 if(k==='ArrowLeft')cam.yaw-=.12;else if(k==='ArrowRight')cam.yaw+=.12;else if(k==='ArrowUp')cam.pitch=clamp(cam.pitch-.08,.04,1.52);else if(k==='ArrowDown')cam.pitch=clamp(cam.pitch+.08,.04,1.52);
 else if(k==='+'||k==='=')tgt.zoom=clamp(tgt.zoom*1.2,.35,7);else if(k==='-')tgt.zoom=clamp(tgt.zoom/1.2,.35,7);else if(k==='Escape')select(null);else return;
 syncTgt();
});

/* ---------- render ---------- */
function resize(){W=stage.clientWidth||800;H=stage.clientHeight||600;svg.setAttribute('viewBox','0 0 '+W+' '+H);if(sel){popW=pop.offsetWidth;popH=pop.offsetHeight}}
window.addEventListener('resize',resize);
const LD=(()=>{const l=[-.35,.8,.5],m=Math.hypot(...l);return l.map(x=>x/m)})();
function hide(o){if(o.shown!==false){o.el.style.display='none';o.shown=false}}
function show(o){if(o.shown===false){o.el.style.display='';o.shown=true}}
const res=v=>typeof v==='function'?v():v;

function render(){
 const ca=Math.cos(cam.yaw),sa=Math.sin(cam.yaw),cb=Math.cos(cam.pitch),sb=Math.sin(cam.pitch);
 const S=Math.min(W/17,H/17.5)*cam.zoom,D=cam.D,cx=W/2+cam.px,cy=H/2+cam.py;
 const V=p=>{const x=p[0]-cam.tx,y=p[1]-cam.ty,z=p[2]-cam.tz,x1=x*ca+z*sa,z1=-x*sa+z*ca;return [x1,y*cb-z1*sb,y*sb+z1*cb]};
 const N=n=>{const z1=-n[0]*sa+n[2]*ca;return [n[0]*ca+n[2]*sa,n[1]*cb-z1*sb,n[1]*sb+z1*cb]};
 const P=v=>{const k=D/Math.max(.5,D-v[2]);return [cx+v[0]*S*k,cy-v[1]*S*k,k]};
 const facing=(n,v0)=>{const nv=N(res(n));return nv[0]*(-v0[0])+nv[1]*(-v0[1])+nv[2]*(D-v0[2])>0};
 const pulse=1+.15*Math.sin(T*5);
 const ord=[];let idx=0;
 for(const o of items){
  idx++;
  if((o.group&&!st[o.group])||(o.fl!==undefined&&o.fl>st.level)){hide(o);ord.push([-1e9+idx,o]);continue}
  const isSel=sel&&o.tag&&sel.tags.indexOf(o.tag)>=0;
  const dimF=(sel&&!isSel&&o.layer>=2&&o.layer<9)?.3:1;
  if(o.type==='poly'){
   const v=res(o.pts).map(V);
   let ghost=false;
   if(o.n&&!facing(o.n,v[0])){if(o.ghost)ghost=true;else{hide(o);ord.push([-1e9+idx,o]);continue}}
   let z=0;if(o.dp){z=V(res(o.dp))[2]}else{for(const q of v)z+=q[2];z/=v.length}
   ord.push([(ghost?9.5:o.layer)*100+z+o.sub*.001,o]);show(o);
   let s='';for(const q of v){const p=P(q);s+=p[0].toFixed(1)+','+p[1].toFixed(1)+' '}
   setA(o,'points',s);
   if(ghost){setA(o,'fill','none');setA(o,'stroke',o.c);setA(o,'stroke-opacity',isSel?.9:.3);setA(o,'stroke-width',isSel?1.6:.9);setA(o,'opacity',1)}
   else{
    let lum=.5;if(o.n){const n=res(o.n);lum=Math.max(0,n[0]*LD[0]+n[1]*LD[1]+n[2]*LD[2])}
    const m=clamp(o.k*(.7+1.1*lum)*1.25*(isSel?2.2:1),0,1);
    setA(o,'fill','rgb('+Math.round(BG[0]+(o.rgb[0]-BG[0])*m)+','+Math.round(BG[1]+(o.rgb[1]-BG[1])*m)+','+Math.round(BG[2]+(o.rgb[2]-BG[2])*m)+')');
    setA(o,'fill-opacity',o.op);setA(o,'stroke',o.c);setA(o,'stroke-opacity',isSel?1:o.so);
    setA(o,'stroke-width',(isSel?o.sw*2.1*pulse:o.sw).toFixed(2));setA(o,'opacity',dimF);
   }
  }else if(o.type==='line'){
   const v=res(o.pts).map(V);
   if(o.n&&!facing(o.n,v[0])){hide(o);ord.push([-1e9+idx,o]);continue}
   let z=0;if(o.dp){z=V(res(o.dp))[2]}else{for(const q of v)z+=q[2];z/=v.length}
   ord.push([o.layer*100+z+o.sub*.001,o]);show(o);
   let d='';v.forEach((q,i)=>{const p=P(q);d+=(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)});
   setA(o,'d',d);setA(o,'stroke',o.c);setA(o,'stroke-opacity',isSel?1:o.so);setA(o,'stroke-width',(isSel?o.sw*1.7:o.sw).toFixed(2));setA(o,'opacity',dimF);
   if(o.dash){setA(o,'stroke-dasharray',o.dash);if(o.flow)o.el.setAttribute('stroke-dashoffset',(-(T*o.speed)%1000).toFixed(1))}
  }else{
   const v=V(res(o.p));
   if(o.n&&!facing(o.n,v)){hide(o);ord.push([-1e9+idx,o]);continue}
   let z=v[2];if(o.dp)z=V(res(o.dp))[2];
   ord.push([o.layer*100+z+o.sub*.001,o]);show(o);
   const p=P(v),r=Math.max(1.1,o.r*S*p[2]);
   setA(o,'cx',p[0].toFixed(1));setA(o,'cy',p[1].toFixed(1));setA(o,'r',r.toFixed(2));setA(o,'fill',o.c);
   const bo=o.blink?(Math.sin(T*o.blink.sp+o.blink.ph)>-.25?1:.2):1;
   setA(o,'opacity',(bo*dimF).toFixed(2));
  }
 }
 ord.sort((a,b)=>a[0]-b[0]);
 let ch=sceneG.firstChild;
 for(const e of ord){const el=e[1].el;if(ch===el)ch=ch.nextSibling;else sceneG.insertBefore(el,ch)}

 for(const l of labels){
  const off=!st[l.group]||(l.fl!==undefined&&l.fl>st.level);
  if(off){if(l.on!==false){l.el.style.display='none';l.on=false}continue}
  if(l.on===false){l.el.style.display='';l.on=true}
  const p=P(V(l.pos));l.el.setAttribute('x',p[0].toFixed(1));l.el.setAttribute('y',(p[1]+l.dy).toFixed(1));
 }
 for(const h of HS){
  if(h.fl>st.level){h.g.style.display='none';h.chip.style.display='none';h.vis0=true;continue}
  h.g.style.display='';
  const v=V(h.a),p=P(v);h.sx=p[0];h.sy=p[1];
  let vis=1;if(h.n&&!facing(h.n,v))vis=.4;
  const act=sel===h||hov===h;
  h.g.setAttribute('transform','translate('+p[0].toFixed(1)+' '+p[1].toFixed(1)+')');
  h.g.setAttribute('opacity',sel&&sel!==h?vis*.65:vis);
  const ph=(T*9+h.i*2.3)%10;
  h.ring.setAttribute('r',(12+ph*(act?1.6:1)).toFixed(1));h.ring.setAttribute('stroke-opacity',(.35*(1-ph/10)).toFixed(2));
  h.dot.setAttribute('stroke-width',act?3:1.8);
  const showChip=(st.labels||hov===h)&&sel!==h;
  h.chip.style.display=showChip?'':'none';
  if(showChip){
   const side=p[0]>cx?1:-1,off=st.labels&&hov!==h?-18-(h.i%4)*22:-30,x=side>0?24:-24-h.w;
   h.chip.setAttribute('transform','translate('+p[0].toFixed(1)+' '+p[1].toFixed(1)+')');
   h.rect.setAttribute('x',x);h.rect.setAttribute('y',off);h.txt.setAttribute('x',x+10);h.txt.setAttribute('y',off+15);
   h.lead.setAttribute('d','M'+(side*11)+' -4L'+(side*24)+' '+(off+11));
   h.chip.setAttribute('opacity',vis<1?.55:1);
  }
 }
 if(sel){
  const narrow=W<640;
  let left,top;
  if(narrow){left=(W-popW)/2;top=60}
  else{const side=sel.sx>W/2?-1:1;left=side>0?sel.sx+44:sel.sx-44-popW;top=sel.sy-popH/2}
  left=clamp(left+popOff.x,8,Math.max(8,W-popW-8));
  top=clamp(top+popOff.y,56,Math.max(56,H-popH-150));
  pop.style.transform='translate('+left.toFixed(0)+'px,'+top.toFixed(0)+'px)';
  const qx=clamp(sel.sx,left,left+popW),qy=clamp(sel.sy,top,top+popH);
  leadP.setAttribute('d','M'+sel.sx.toFixed(1)+' '+sel.sy.toFixed(1)+'L'+qx.toFixed(1)+' '+qy.toFixed(1));
  leadD.setAttribute('cx',qx.toFixed(1));leadD.setAttribute('cy',qy.toFixed(1));
 }
}

let last=performance.now(),rc=0;
function loop(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
 const k=1-Math.exp(-dt*5);
 if(!dragging){
  if(st.auto&&!gyro){cam.yaw+=dt*.2;tgt.yaw=cam.yaw}else if(!gyro)cam.yaw+=(tgt.yaw-cam.yaw)*k;
  for(const key of ['pitch','zoom','px','py','tx','ty','tz'])if(!gyro||key!=='pitch')cam[key]+=(tgt[key]-cam[key])*k;
 }
 render();
 if(++rc%8===0)$('#readout').innerHTML='Rotación '+Math.round(((cam.yaw*180/Math.PI)%360+360)%360)+'° · Inclinación '+Math.round(cam.pitch*180/Math.PI)+'° · Zoom '+cam.zoom.toFixed(2)+'×<br>Maqueta ilustrativa basada en el diagrama adjunto';
 requestAnimationFrame(loop);
}
resize();build();syncBtns();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
