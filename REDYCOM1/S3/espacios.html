<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sala de Telecomunicaciones 3D – Maqueta con Realidad Aumentada</title>
<style>
:root{--bg:#02050d;--cy:#8fa8c4;--mg:#f0707f;--gr:#4cc9a0;--ye:#e8c547;--tx:#d6f4ff;--dim:#86adc4}
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);overflow:hidden}
#app{display:flex;height:100%;width:100%}
#stage{position:relative;flex:1;min-width:0;overflow:hidden;background:radial-gradient(ellipse at 50% 58%,#0b2342 0%,#050d1c 55%,#02050d 100%);touch-action:none}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#stage.ar{background:#000}
#stage.ar #cam{display:block}
#stage.ar .fx.grid,#stage.ar .fx.vig{display:none}
#svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#svg.drag{cursor:grabbing}
#svg text{font-family:Arial,Helvetica,sans-serif;pointer-events:none}
.fx{position:absolute;inset:0;pointer-events:none}
.grid{background-image:linear-gradient(rgba(25,230,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(25,230,255,.07) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(ellipse at 50% 58%,#000 25%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 58%,#000 25%,transparent 75%)}
.scan{background:linear-gradient(to bottom,rgba(25,230,255,0),rgba(25,230,255,.13) 50%,rgba(25,230,255,0));background-size:100% 200px;background-repeat:no-repeat;animation:sc 6s linear infinite}
@keyframes sc{from{background-position:0 -200px}to{background-position:0 calc(100% + 200px)}}
.vig{background:repeating-linear-gradient(to bottom,rgba(255,255,255,.018) 0 1px,transparent 1px 3px)}
.corner{position:absolute;width:34px;height:34px;border:2px solid var(--cy);box-shadow:0 0 10px var(--cy);pointer-events:none;opacity:.8}
.tl{top:10px;left:10px;border-right:0;border-bottom:0}.tr{top:10px;right:10px;border-left:0;border-bottom:0}
.bl{bottom:10px;left:10px;border-right:0;border-top:0}.br{bottom:10px;right:10px;border-left:0;border-top:0}
#title{position:absolute;top:18px;left:24px;pointer-events:none}
#title h1{margin:0;font-size:17px;letter-spacing:2px;color:#fff;text-shadow:0 0 6px var(--cy),0 0 16px var(--cy),0 0 30px var(--cy)}
#title p{margin:4px 0 0;font-size:12px;color:var(--cy);text-shadow:0 0 8px rgba(25,230,255,.7)}
#badge{position:absolute;top:20px;right:26px;font-size:12px;color:var(--gr);text-shadow:0 0 8px var(--gr);letter-spacing:1px;pointer-events:none;animation:bl 1.6s infinite}
@keyframes bl{50%{opacity:.45}}
#readout{position:absolute;left:24px;bottom:104px;font-size:11px;color:var(--dim);pointer-events:none;line-height:1.5}
#toolbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;width:96%;z-index:5}
.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.btn{background:rgba(4,18,38,.82);color:var(--cy);border:1px solid rgba(25,230,255,.6);border-radius:6px;padding:7px 10px;font-size:12px;cursor:pointer;box-shadow:0 0 9px rgba(25,230,255,.28),inset 0 0 9px rgba(25,230,255,.08);text-shadow:0 0 6px rgba(25,230,255,.8);transition:.15s}
.btn:hover{background:rgba(25,230,255,.18);color:#fff}
.btn.on{background:rgba(25,230,255,.26);color:#fff;box-shadow:0 0 16px rgba(25,230,255,.8),inset 0 0 10px rgba(25,230,255,.25)}
.btn.v{border-color:rgba(255,45,149,.65);color:#cbd5e1;text-shadow:0 0 6px rgba(255,45,149,.8);box-shadow:0 0 9px rgba(255,45,149,.25)}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);max-width:88%;background:rgba(4,18,38,.94);border:1px solid var(--cy);color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;box-shadow:0 0 18px rgba(25,230,255,.5);opacity:0;pointer-events:none;transition:opacity .3s;z-index:6;text-align:center}
#toast.show{opacity:1}
#panel{width:355px;flex:none;background:rgba(3,10,22,.95);border-left:1px solid rgba(25,230,255,.4);box-shadow:-6px 0 26px rgba(25,230,255,.12);display:flex;flex-direction:column;min-height:0}
#detail{padding:14px 14px 8px;overflow-y:auto;max-height:52%;flex:none;border-bottom:1px solid rgba(25,230,255,.2);font-size:13px;line-height:1.45}
#detail h2{margin:0 0 8px;font-size:15px;color:#fff;text-shadow:0 0 8px var(--c),0 0 18px var(--c)}
#detail .card{border-left:3px solid var(--c);padding-left:10px;box-shadow:-8px 0 14px -10px var(--c)}
.tagb{display:inline-block;font-size:10px;letter-spacing:.5px;padding:2px 6px;border-radius:4px;margin:8px 0 3px;border:1px solid}
.b1{color:#8fa8c4;border-color:#8fa8c4}.b2{color:#e0a458;border-color:#e0a458}.b3{color:#b9c6d0;border-color:#8798a6}
#detail p{margin:2px 0}
#detail .help li{margin:5px 0;color:var(--tx)}
#detail ul{padding-left:18px;margin:6px 0}
#detail small{color:var(--dim);display:block;margin-top:8px;font-size:11px}
#listwrap{overflow-y:auto;padding:8px 12px 14px;flex:1;min-height:0}
#listwrap h3{margin:4px 0 6px;font-size:12px;letter-spacing:1.5px;color:var(--cy)}
.it{display:flex;gap:9px;align-items:center;padding:6px 8px;border:1px solid rgba(255,255,255,.09);border-radius:7px;margin:4px 0;cursor:pointer;font-size:13px;color:var(--tx);background:rgba(255,255,255,.02)}
.it:hover{background:rgba(255,255,255,.07)}
.it .n{flex:none;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;font-weight:bold;font-size:12px;border:1.5px solid var(--c);color:var(--c);box-shadow:0 0 8px var(--c),inset 0 0 6px var(--c)}
.it.sel{background:rgba(255,255,255,.1);border-color:var(--c);box-shadow:0 0 12px -2px var(--c)}
@media (max-width:860px){
 #app{flex-direction:column}
 #panel{width:100%;height:42%;border-left:0;border-top:1px solid rgba(25,230,255,.4)}
 #detail{max-height:55%}
 #title h1{font-size:13px}#title p{display:none}
 #readout{display:none}
 .btn{padding:6px 8px;font-size:11px}
}

:root{--bg:#0b1220;--cy:#7fa6d6;--tx:#e2e8f0;--dim:#94a3b8;--ac:#3b82f6}
#stage{background:radial-gradient(ellipse at 50% 45%,#1b2740 0%,#111b2e 55%,#0b1220 100%)!important}
.grid{background-image:linear-gradient(rgba(148,163,184,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.05) 1px,transparent 1px)!important}
.scan,.vig{display:none!important}
.corner{border-color:rgba(148,163,184,.45)!important;box-shadow:none!important;opacity:1!important;width:22px;height:22px}
#title h1{font-weight:bold;letter-spacing:1.5px;font-size:16px;color:#f1f5f9!important;text-shadow:none!important}
#title p{color:#94a3b8!important;text-shadow:none!important}
#badge{color:#34d399!important;text-shadow:none!important;animation:none!important;font-size:11px;background:rgba(15,23,42,.7);border:1px solid rgba(52,211,153,.35);padding:4px 10px;border-radius:999px;top:16px}
.btn{background:rgba(15,23,42,.88)!important;color:#cbd5e1!important;border:1px solid rgba(148,163,184,.25)!important;border-radius:8px!important;box-shadow:0 2px 8px rgba(0,0,0,.35)!important;text-shadow:none!important;backdrop-filter:blur(6px)}
.btn:hover{background:rgba(51,65,85,.95)!important;color:#fff!important}
.btn.on{background:#2563eb!important;border-color:#3b82f6!important;color:#fff!important;box-shadow:0 2px 10px rgba(37,99,235,.45)!important}
.btn.v{color:#cbd5e1!important;border-color:rgba(148,163,184,.25)!important;box-shadow:0 2px 8px rgba(0,0,0,.35)!important;text-shadow:none!important}
#toast{border:1px solid rgba(148,163,184,.3)!important;box-shadow:0 8px 24px rgba(0,0,0,.45)!important;background:rgba(15,23,42,.96)!important}
#panel{background:#0f172a!important;border-left:1px solid rgba(148,163,184,.15)!important;box-shadow:none!important}
#detail{border-bottom:1px solid rgba(148,163,184,.15)!important}
#detail h2{text-shadow:none!important;color:#f8fafc!important}
#detail .card{box-shadow:none!important;border-left:3px solid var(--c)}
.b1{color:#7fb2f0!important;border-color:#3b6ea8!important}.b2{color:#e0a458!important;border-color:#8a6430!important}
#listwrap h3{color:#94a3b8!important;font-weight:bold}
.it{background:rgba(255,255,255,.03)!important;border:1px solid rgba(148,163,184,.14)!important}
.it .n{box-shadow:none!important;background:color-mix(in srgb,var(--c) 18%,transparent)}
.it.sel{box-shadow:none!important;background:rgba(255,255,255,.08)!important}
@media (max-width:860px){#title h1{font-size:13px}}
</style>
</head>
<body>
<div id="app">
 <div id="stage">
  <video id="cam" playsinline muted></video>
  <div class="fx grid"></div>
  <div class="fx scan"></div>
  <div class="fx vig"></div>
  <svg id="svg" xmlns="http://www.w3.org/2000/svg">
   <defs>
    <filter id="glow" x="-10%" y="-10%" width="125%" height="130%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".38"/></filter>
    <filter id="glow2" x="-40%" y="-40%" width="180%" height="190%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".5"/></filter>
   </defs>
   <g id="scene" filter="url(#glow)"></g>
   <g id="overlay"></g>
  </svg>
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <div id="title"><h1>SALA DE TELECOMUNICACIONES</h1><p>Maqueta 3D interactiva · 3 m × 2.4 m · Realidad aumentada</p></div>
  <div id="badge">● RA HOLOGRÁFICA</div>
  <div id="readout"></div>
  <div id="toolbar">
   <div class="row" id="rowv">
    <button class="btn v" data-v="iso">Isométrica</button>
    <button class="btn v" data-v="front">Frontal</button>
    <button class="btn v" data-v="top">Planta</button>
    <button class="btn v" data-v="side">Lateral</button>
    <button class="btn v" data-v="back">Trasera</button>
   </div>
   <div class="row" id="rowt">
    <button class="btn" data-a="auto">Auto-giro</button>
    <button class="btn" data-a="dims">Cotas</button>
    <button class="btn" data-a="flow">Flujos</button>
    <button class="btn" data-a="labels">Etiquetas</button>
    <button class="btn" data-a="neon">Sombras</button>
    <button class="btn" data-a="door">Puerta</button>
    <button class="btn" data-a="ar">Cámara AR</button>
    <button class="btn" data-a="gyro" id="bgyro">Giroscopio</button>
    <button class="btn" data-a="zout">−</button>
    <button class="btn" data-a="zin">+</button>
    <button class="btn" data-a="reset">Restablecer</button>
   </div>
  </div>
  <div id="toast"></div>
 </div>
 <aside id="panel">
  <div id="detail"></div>
  <div id="listwrap"><h3>COMPONENTES · TOQUE PARA INSPECCIONAR</h3><div id="list"></div></div>
 </aside>
</div>

<script>
(()=>{
'use strict';
const NS='http://www.w3.org/2000/svg';
const $=s=>document.querySelector(s);
const stage=$('#stage'),svg=$('#svg'),sceneG=$('#scene'),ovG=$('#overlay'),vid=$('#cam');
let W=800,H=600;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- colores neón ---------- */
const C={wall:'#8fa8c4',ply:'#e0a458',hvac:'#6ea8fe',pow:'#e8c547',fire:'#f0707f',cond:'#a58df0',rack:'#4cc9a0',grd:'#a3d96b',stat:'#e2e8f0',lv:'#4fd1c5',door:'#9cc7f0',dim:'#cbd5e1'};
const BG=[15,23,42];
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];

/* ---------- estado ---------- */
const st={dims:true,flow:true,labels:false,neon:true,auto:true};
const cam={yaw:-0.62,pitch:0.5,zoom:1.0,px:0,py:-34,tx:0,ty:1.3,tz:0,D:9};
const tgt=Object.assign({},cam);
const HOME={yaw:-0.62,pitch:0.5,zoom:1.0,px:0,py:-34,tx:0,ty:1.3,tz:0};
let T=0,sel=null,hov=null,dragging=false,doorTarget=0,doorAng=0,doorG=null;

/* ---------- registro de primitivas ---------- */
const items=[],labels=[];
const mk=(t,a)=>{const e=document.createElementNS(NS,t);if(a)for(const k in a)e.setAttribute(k,a[k]);return e};
function reg(o,el){o.el=el;o._a={};sceneG.appendChild(el);items.push(o);return o}
function setA(o,k,v){if(o._a[k]!==v){o._a[k]=v;o.el.setAttribute(k,v)}}
function addPoly(o){o.type='poly';o.layer=o.layer??3;o.k=o.k??.12;o.op=o.op??1;o.sw=(o.sw??1)*.85;o.so=o.so??.9;o.sub=o.sub||0;o.rgb=hex(o.c);return reg(o,mk('polygon',{'stroke-linejoin':'round'}))}
function addLine(o){o.type='line';o.layer=o.layer??3;o.sw=o.sw??1.5;o.so=o.so??.9;o.sub=o.sub||0;o.rgb=hex(o.c);return reg(o,mk('path',{fill:'none','stroke-linecap':'round','stroke-linejoin':'round'}))}
function addDot(o){o.type='dot';o.layer=o.layer??3;o.sub=o.sub||0;return reg(o,mk('circle',{}))}
function addLabel(o){o.el=mk('text',{'text-anchor':'middle','font-size':12,fill:o.c||C.dim,stroke:'#02050d','stroke-width':3,'paint-order':'stroke'});o.el.textContent=o.text;ovG.insertBefore(o.el,ovG.firstChild);labels.push(o);return o}

function addBox(x0,x1,y0,y1,z0,z1,o){
 const F=[
  {n:[1,0,0],p:[[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]},
  {n:[-1,0,0],p:[[x0,y0,z1],[x0,y1,z1],[x0,y1,z0],[x0,y0,z0]]},
  {n:[0,1,0],p:[[x0,y1,z0],[x0,y1,z1],[x1,y1,z1],[x1,y1,z0]]},
  {n:[0,-1,0],p:[[x0,y0,z1],[x0,y0,z0],[x1,y0,z0],[x1,y0,z1]]},
  {n:[0,0,1],p:[[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]},
  {n:[0,0,-1],p:[[x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0]]}];
 F.forEach((f,i)=>{const s=o.face?o.face(i):{};if(s===false)return;const p=Object.assign({},o,s,{pts:f.p,n:f.n});delete p.face;addPoly(p)});
}
function ring(c,u,v,r,n=22){const a=[];for(let i=0;i<n;i++){const t=i/n*Math.PI*2,cs=Math.cos(t)*r,sn=Math.sin(t)*r;a.push([c[0]+u[0]*cs+v[0]*sn,c[1]+u[1]*cs+v[1]*sn,c[2]+u[2]*cs+v[2]*sn])}return a}
function rectPts(c,u,v,w,h){const a=w/2,b=h/2;return [[-1,-1],[1,-1],[1,1],[-1,1]].map(([s,t])=>[c[0]+u[0]*s*a+v[0]*t*b,c[1]+u[1]*s*a+v[1]*t*b,c[2]+u[2]*s*a+v[2]*t*b])}
const plate=(c,u,v,w,h,n,o)=>addPoly(Object.assign({pts:rectPts(c,u,v,w,h),n},o));
const circ=(c,u,v,r,n,o,seg)=>addPoly(Object.assign({pts:ring(c,u,v,r,seg||22),n},o));
function crom(P,s=6){const out=[],n=P.length;for(let i=0;i<n-1;i++){const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(n-1,i+2)];for(let j=0;j<s;j++){const t=j/s,t2=t*t,t3=t2*t;out.push([0,1,2].map(k=>.5*(2*p1[k]+(-p0[k]+p2[k])*t+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*t3)))}}out.push(P[n-1]);return out}
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};

/* =====================  ESCENA  ===================== */
function build(){
 /* plataforma holográfica */
 addPoly({pts:[[-2.7,-.03,-2.2],[-2.7,-.03,2.2],[2.7,-.03,2.2],[2.7,-.03,-2.2]],n:[0,1,0],c:C.wall,k:.035,sw:1,so:.45,layer:-1});
 for(let x=-2.5;x<=2.51;x+=.5)addLine({pts:[[x,-.03,-2.2],[x,-.03,2.2]],c:C.wall,sw:1,so:.16,layer:-.9});
 for(let z=-2;z<=2.01;z+=.5)addLine({pts:[[-2.7,-.03,z],[2.7,-.03,z]],c:C.wall,sw:1,so:.16,layer:-.9});
 const rp=[];for(let i=0;i<=80;i++){const t=i/80*Math.PI*2;rp.push([Math.cos(t)*3.2,-.02,Math.sin(t)*3.2])}
 addLine({pts:rp,c:C.wall,sw:1.4,so:.55,dash:'3 10',flow:true,speed:14,layer:-.8});

 /* piso */
 addPoly({pts:[[-1.5,0,-1.2],[-1.5,0,1.2],[1.5,0,1.2],[1.5,0,-1.2]],n:[0,1,0],c:C.wall,k:.08,sw:1.4,so:.9,layer:0});
 for(let x=-1.2;x<1.49;x+=.3)addLine({pts:[[x,0,-1.2],[x,0,1.2]],c:C.wall,sw:1,so:.2,layer:.1});
 for(let z=-.9;z<1.19;z+=.3)addLine({pts:[[-1.5,0,z],[1.5,0,z]],c:C.wall,sw:1,so:.2,layer:.1});

 /* muros (cara interior sólida / cara exterior cristal) */
 const wall=(x0,x1,y0,y1,z0,z1,inner)=>addBox(x0,x1,y0,y1,z0,z1,{layer:1,c:C.wall,k:.1,sw:1.3,so:.9,face:i=>i===inner?{}:i===3?false:i===2?{layer:4,op:.16,k:.3,so:.95,sw:1.5}:{layer:4,op:.06,k:.15,sw:.9,so:.5}});
 wall(-1.65,1.65,0,3,-1.35,-1.2,4);        /* fondo */
 wall(-1.65,-1.5,0,3,-1.2,1.2,0);          /* izquierda */
 wall(1.5,1.65,0,3,-1.2,.25,1);            /* derecha A */
 wall(1.5,1.65,2.1,3,.25,1.15,1);          /* dintel */
 wall(1.5,1.65,0,3,1.15,1.2,1);            /* derecha B */
 wall(-1.65,1.65,0,3,1.2,1.35,5);          /* frontal */

 /* paredes de madera contrachapada 21 mm, altura 2.4 m */
 const ply=(x0,x1,z0,z1,skip)=>addBox(x0,x1,0,2.4,z0,z1,{layer:2,c:C.ply,k:.2,sw:1.1,so:.95,tag:'ply',face:i=>(i===3||i===skip)?false:{}});
 ply(-1.5,1.5,-1.2,-1.179,5);
 ply(-1.5,-1.479,-1.179,1.179,1);
 ply(1.479,1.5,-1.179,.25,0);
 ply(-1.479,-.55,1.179,1.2,4);

 /* racks */
 const rackX=[-.95,-.32,.31,.94];
 const KD={f:['#f0707f',.34],p:['#4cc9a0',.26],s:['#5bc0eb',.32],v:['#6ea8fe',.34],u:['#e8c547',.28],b:['#2a4a5c',.22]};
 const LAY=[
  ['f2','p1','p1','s1','p1','p1','s1','p1','p1','s1','p1','p1','s1','b2','v2','v2','b1','u4'],
  ['p1','p1','s1','p1','p1','s1','p1','p1','s1','p1','p1','s1','p1','p1','s1','b1','v1','v1','v2','u3','u3'],
  ['f2','f2','s1','s1','b1','v2','v2','v2','v2','v2','v2','b1','u3','u3'],
  ['p1','s1','p1','s1','p1','s1','b2','v2','v2','v2','v2','b1','u4','u4']];
 rackX.forEach((xc,ri)=>{
  const dp=[xc,1.05,0];
  addBox(xc-.3,xc+.3,0,2.1,-.3,.3,{layer:3,c:C.rack,k:.07,sw:1.5,so:1,tag:'rack',dp,sub:0,face:i=>i===3?false:{}});
  let y=.14;
  LAY[ri].forEach(code=>{
   const kd=code[0],u=+code.slice(1),h=u*.056,y0=y,y1=y+h;y=y1+.007;
   const z=.303,x0=xc-.25,x1=xc+.25;

HS.forEach((h,i)=>{
 h.i=i;h.k=i+1;
 h.g=mk('g',{class:'hs',style:'cursor:pointer'});
 h.chip=mk('g',{style:'pointer-events:none'});
 h.lead=mk('path',{fill:'none',stroke:h.c,'stroke-width':1.2,opacity:.8});
 h.rect=mk('rect',{rx:5,ry:5,height:22,fill:'#0f172a',stroke:h.c,'stroke-width':1.2});
 h.txt=mk('text',{'font-size':11.5,fill:'#fff',y:15});h.txt.textContent=h.k+'. '+h.short;
 h.w=h.short.length*6.1+30;h.rect.setAttribute('width',h.w);
 h.chip.append(h.lead,h.rect,h.txt);
 h.ring=mk('circle',{r:12,fill:'none',stroke:h.c,'stroke-width':1.5});
 h.dot=mk('circle',{r:11,fill:'#0f172a',stroke:h.c,'stroke-width':1.8});
 h.num=mk('text',{'font-size':11.5,'font-weight':'bold','text-anchor':'middle',y:4.2,fill:h.c});h.num.textContent=h.k;
 h.hit=mk('circle',{r:16,fill:'transparent'});
 h.g.append(h.ring,h.dot,h.num,h.hit);
 h.g.addEventListener('click',e=>{e.stopPropagation();select(sel===h?null:h)});
 h.g.addEventListener('mouseenter',()=>hov=h);
 h.g.addEventListener('mouseleave',()=>{if(hov===h)hov=null});
 hsG.append(h.g);
});
const chipG=mk('g',{filter:'url(#glow2)'});ovG.appendChild(chipG);
HS.forEach(h=>chipG.append(h.chip));

/* ---------- panel ---------- */
const listEl=$('#list'),detEl=$('#detail');
HS.forEach(h=>{
 const d=document.createElement('div');d.className='it';d.style.setProperty('--c',h.c);
 d.innerHTML='<span class="n">'+h.k+'</span><span>'+h.name+'</span>';
 d.onclick=()=>select(sel===h?null:h);h.li=d;listEl.append(d);
});
const SRC='<small><b>Origen de la información:</b> «Del diagrama» = leído de las dos imágenes adjuntas (parecen corresponder a una guía tipo ANSI/TIA-569; es una inferencia, no está confirmado). «Contexto» = conocimiento general del modelo, no verificado en la web; puede ser incompleto o inexacto. «Geometría» = supuestos e ilustraciones de la maqueta.</small>';
function renderPanel(){
 HS.forEach(h=>h.li.classList.toggle('sel',h===sel));
 if(!sel){
  detEl.innerHTML='<div class="card" style="--c:#8fa8c4"><h2>Cómo usar la maqueta</h2><ul class="help"><li><b>Arrastre</b> para rotar la maqueta 360°.</li><li><b>Rueda del ratón</b> o <b>pellizco</b> para acercar/alejar.</li><li><b>Clic derecho</b>, <b>Shift + arrastre</b> o <b>dos dedos</b> para mover.</li><li><b>Doble clic</b> restablece la vista.</li><li>Toque un <b>número</b> en el modelo o en la lista para ver su descripción.</li><li><b>Cámara AR</b> superpone la maqueta sobre la imagen de su cámara.</li></ul><small><b>Glosario:</b> SFP = sobre el piso final (AFF) · HVAC = calefacción, ventilación y aire acondicionado · EDP = tablero de distribución eléctrica · TGB = barra de conexión a tierra de telecomunicaciones · ▼ = salida/conector de telecomunicaciones.</small></div>'+SRC;
 }else{
  detEl.innerHTML='<div class="card" style="--c:'+sel.c+'"><h2>'+sel.k+'. '+sel.name+'</h2><span class="tagb b1">DEL DIAGRAMA</span><p>'+sel.dato+'</p><span class="tagb b2">CONTEXTO GENERAL (no verificado)</span><p>'+sel.ctx+'</p><span class="tagb b3">GEOMETRÍA / SUPUESTOS</span><p>'+sel.geo+'</p></div>'+SRC;
 }
 detEl.scrollTop=0;
}

/* ---------- selección y vistas ---------- */
const near=(cur,a)=>a+Math.round((cur-a)/(Math.PI*2))*Math.PI*2;
function select(h){
 sel=h;st.auto=false;
 if(h){
  if(h.id==='dim'&&!st.dims)st.dims=true;
  if(h.id==='door')doorTarget=1.55;
  if(h.n){
   tgt.tx=h.a[0];tgt.ty=h.a[1];tgt.tz=h.a[2];tgt.zoom=1.8;tgt.px=0;tgt.py=-20;
   if(Math.abs(h.n[1])>.5){tgt.pitch=1.1}else{tgt.yaw=near(cam.yaw,Math.atan2(-h.n[0],h.n[2]));tgt.pitch=.3}
  }else{Object.assign(tgt,HOME,{yaw:near(cam.yaw,0),pitch:.9,zoom:1.1})}
 }else{Object.assign(tgt,{tx:0,ty:1.3,tz:0,zoom:1.0,px:0,py:-34})}
 renderPanel();syncBtns();
}
const VIEWS={iso:{yaw:-.62,pitch:.5},front:{yaw:0,pitch:.12},top:{yaw:0,pitch:1.5},side:{yaw:-1.5,pitch:.3},back:{yaw:Math.PI,pitch:.3}};
function view(n){sel=null;st.auto=false;const v=VIEWS[n];Object.assign(tgt,{tx:0,ty:1.3,tz:0,px:0,py:-34,zoom:n==='top'?1.2:1.0,pitch:v.pitch,yaw:near(cam.yaw,v.yaw)});renderPanel();syncBtns()}

/* ---------- toolbar ---------- */
let stream=null,gyro=false,g0=null,gBase=0,gTimer=0;
function toast(m,ms=4200){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),ms)}
function syncBtns(){
 document.querySelectorAll('[data-a]').forEach(b=>{const a=b.dataset.a;let on=false;
  if(a in st)on=st[a];if(a==='door')on=doorTarget>0;if(a==='ar')on=stage.classList.contains('ar');if(a==='gyro')on=gyro;b.classList.toggle('on',on)});
 sceneG.setAttribute('filter',st.neon?'url(#glow)':'none');
}
async function toggleAR(){
 if(stage.classList.contains('ar')){stopAR();return}
 try{
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('sin API');
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  vid.srcObject=stream;await vid.play();
  stage.classList.add('ar');$('#badge').textContent='● RA CÁMARA ACTIVA';
  toast('Realidad aumentada activa: la maqueta flota sobre la imagen de su cámara. Arrastre para rotarla o use el giroscopio.');
 }catch(e){toast('No se pudo abrir la cámara (permiso denegado o dispositivo sin cámara). Si abre el archivo desde el navegador del teléfono o PC y acepta el permiso, funcionará; mientras tanto se mantiene el modo holográfico.',7000)}
 syncBtns();
}
function stopAR(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}vid.srcObject=null;stage.classList.remove('ar');$('#badge').textContent='● RA HOLOGRÁFICA';syncBtns()}
function onOri(e){
 if(e.alpha==null)return;g0=g0===null?e.alpha:g0;gTimer=1;
 const y=gBase-(e.alpha-g0)*Math.PI/180,p=clamp((90-(e.beta??45))*Math.PI/180,.05,1.5);
 cam.yaw=tgt.yaw=y;cam.pitch=tgt.pitch=p;
}
async function toggleGyro(){
 if(gyro){gyro=false;window.removeEventListener('deviceorientation',onOri);syncBtns();return}
 try{
  if(typeof DeviceOrientationEvent==='undefined')throw 0;
  if(typeof DeviceOrientationEvent.requestPermission==='function'){const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted')throw 0}
  gyro=true;g0=null;gTimer=0;gBase=cam.yaw;st.auto=false;window.addEventListener('deviceorientation',onOri);
  setTimeout(()=>{if(gyro&&!gTimer){toast('Este dispositivo no entrega datos de giroscopio (normal en PC). Use el arrastre para rotar.');gyro=false;window.removeEventListener('deviceorientation',onOri);syncBtns()}},1500);
  toast('Giroscopio activo: mueva el dispositivo para rodear la maqueta.');
 }catch(e){toast('Giroscopio no disponible o permiso denegado.')}
 syncBtns();
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.v){view(b.dataset.v);return}
 const a=b.dataset.a;if(!a)return;
 if(a in st){st[a]=!st[a];if(a==='auto'&&st.auto){sel=null;tgt.tx=0;tgt.ty=1.3;tgt.tz=0;renderPanel()}}
 else if(a==='door')doorTarget=doorTarget>0?0:1.55;
 else if(a==='ar')toggleAR();
 else if(a==='gyro')toggleGyro();
 else if(a==='zin')tgt.zoom=clamp(tgt.zoom*1.3,.35,5);
 else if(a==='zout')tgt.zoom=clamp(tgt.zoom/1.3,.35,5);
 else if(a==='reset'){sel=null;doorTarget=0;Object.assign(tgt,HOME,{yaw:near(cam.yaw,HOME.yaw)});st.auto=false;renderPanel()}
 syncBtns();
});
if(!('DeviceOrientationEvent' in window))$('#bgyro').style.display='none';

/* ---------- interacción con el puntero ---------- */
const ptrs=new Map();let panMode=false,lastPinch=0,lastMid=null;
const syncTgt=()=>{tgt.yaw=cam.yaw;tgt.pitch=cam.pitch;tgt.zoom=cam.zoom;tgt.px=cam.px;tgt.py=cam.py};
svg.addEventListener('pointerdown',e=>{
 if(e.target.closest('.hs'))return;
 svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});dragging=true;svg.classList.add('drag');
 panMode=e.button===2||e.shiftKey||e.ctrlKey;
 if(ptrs.size===2){const [a,b]=[...ptrs.values()];lastPinch=Math.hypot(a.x-b.x,a.y-b.y)||1;lastMid={x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
});
svg.addEventListener('pointermove',e=>{
 const p=ptrs.get(e.pointerId);if(!p)return;
 const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
 if(ptrs.size===1){
  if(panMode){cam.px+=dx;cam.py+=dy}else{cam.yaw+=dx*.008;cam.pitch=clamp(cam.pitch+dy*.006,.04,1.52)}
 }else if(ptrs.size===2){
  const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y)||1,mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
  cam.zoom=clamp(cam.zoom*d/lastPinch,.35,5);lastPinch=d;cam.px+=mid.x-lastMid.x;cam.py+=mid.y-lastMid.y;lastMid=mid;
 }
 syncTgt();
});
const endP=e=>{ptrs.delete(e.pointerId);if(!ptrs.size){dragging=false;svg.classList.remove('drag')}};
svg.addEventListener('pointerup',endP);svg.addEventListener('pointercancel',endP);
svg.addEventListener('wheel',e=>{e.preventDefault();cam.zoom=clamp(cam.zoom*Math.exp(-e.deltaY*.0016),.35,5);tgt.zoom=cam.zoom},{passive:false});
svg.addEventListener('contextmenu',e=>e.preventDefault());
svg.addEventListener('dblclick',e=>{if(e.target.closest('.hs'))return;sel=null;Object.assign(tgt,HOME,{yaw:near(cam.yaw,HOME.yaw)});renderPanel()});
window.addEventListener('keydown',e=>{
 const k=e.key;
 if(k==='ArrowLeft')cam.yaw-=.12;else if(k==='ArrowRight')cam.yaw+=.12;else if(k==='ArrowUp')cam.pitch=clamp(cam.pitch-.08,.04,1.52);else if(k==='ArrowDown')cam.pitch=clamp(cam.pitch+.08,.04,1.52);
 else if(k==='+'||k==='=')tgt.zoom=clamp(tgt.zoom*1.2,.35,5);else if(k==='-')tgt.zoom=clamp(tgt.zoom/1.2,.35,5);else if(k==='Escape')select(null);else return;
 syncTgt();
});

/* ---------- render ---------- */
function resize(){W=stage.clientWidth||800;H=stage.clientHeight||600;svg.setAttribute('viewBox','0 0 '+W+' '+H)}
window.addEventListener('resize',resize);

const LD=(()=>{const l=[-.35,.8,.5],m=Math.hypot(...l);return l.map(x=>x/m)})();
function hide(o){if(o.shown!==false){o.el.style.display='none';o.shown=false}}
function show(o){if(o.shown===false){o.el.style.display='';o.shown=true}}
const res=v=>typeof v==='function'?v():v;

function render(){
 const ca=Math.cos(cam.yaw),sa=Math.sin(cam.yaw),cb=Math.cos(cam.pitch),sb=Math.sin(cam.pitch);
 const S=Math.min(W/6.8,H/6.0)*cam.zoom,D=cam.D,cx=W/2+cam.px,cy=H/2+cam.py;
 const V=p=>{const x=p[0]-cam.tx,y=p[1]-cam.ty,z=p[2]-cam.tz,x1=x*ca+z*sa,z1=-x*sa+z*ca;return [x1,y*cb-z1*sb,y*sb+z1*cb]};
 const N=n=>{const z1=-n[0]*sa+n[2]*ca;return [n[0]*ca+n[2]*sa,n[1]*cb-z1*sb,n[1]*sb+z1*cb]};
 const P=v=>{const k=D/Math.max(.5,D-v[2]);return [cx+v[0]*S*k,cy-v[1]*S*k,k]};
 const facing=(n,v0)=>{const nv=N(res(n));return nv[0]*(-v0[0])+nv[1]*(-v0[1])+nv[2]*(D-v0[2])>0};
 const pulse=1+.15*Math.sin(T*5);
 const ord=[];let idx=0;
 for(const o of items){
  idx++;
  if(o.group&&!st[o.group]){hide(o);ord.push([-1e9+idx,o]);continue}
  const isSel=sel&&o.tag&&sel.tags.indexOf(o.tag)>=0;
  const dimF=(sel&&!isSel&&o.layer>=2&&o.layer<4)?.3:1;
  if(o.type==='poly'){
   const v=res(o.pts).map(V);
   let ghost=false;
   if(o.n&&!facing(o.n,v[0])){if(o.ghost)ghost=true;else{hide(o);ord.push([-1e9+idx,o]);continue}}
   let z=0;if(o.dp){z=V(res(o.dp))[2]}else{for(const q of v)z+=q[2];z/=v.length}
   ord.push([(ghost?4.5:o.layer)*100+z+o.sub*.001,o]);show(o);
   let s='';for(const q of v){const p=P(q);s+=p[0].toFixed(1)+','+p[1].toFixed(1)+' '}
   setA(o,'points',s);
   if(ghost){setA(o,'fill','none');setA(o,'stroke',o.c);setA(o,'stroke-opacity',isSel?.9:.3);setA(o,'stroke-width',isSel?1.6:.9);setA(o,'opacity',1)}
   else{
    let lum=.5;if(o.n){const n=res(o.n);lum=Math.max(0,n[0]*LD[0]+n[1]*LD[1]+n[2]*LD[2])}
    const m=clamp(o.k*(.7+1.1*lum)*1.25*(isSel?2.2:1),0,1);
    setA(o,'fill','rgb('+Math.round(BG[0]+(o.rgb[0]-BG[0])*m)+','+Math.round(BG[1]+(o.rgb[1]-BG[1])*m)+','+Math.round(BG[2]+(o.rgb[2]-BG[2])*m)+')');
    setA(o,'fill-opacity',o.op);setA(o,'stroke',o.c);setA(o,'stroke-opacity',isSel?1:o.so);
    setA(o,'stroke-width',(isSel?o.sw*2.1*pulse:o.sw).toFixed(2));setA(o,'opacity',dimF);
   }
  }else if(o.type==='line'){
   const raw=res(o.pts);const v=raw.map(V);
   if(o.n&&!facing(o.n,v[0])){hide(o);ord.push([-1e9+idx,o]);continue}
   let z=0;if(o.dp){z=V(res(o.dp))[2]}else{for(const q of v)z+=q[2];z/=v.length}
   ord.push([o.layer*100+z+o.sub*.001,o]);show(o);
   let d='';v.forEach((q,i)=>{const p=P(q);d+=(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)});
   setA(o,'d',d);setA(o,'stroke',o.c);setA(o,'stroke-opacity',isSel?1:o.so);setA(o,'stroke-width',(isSel?o.sw*1.7:o.sw).toFixed(2));
   setA(o,'opacity',dimF);
   if(o.dash){setA(o,'stroke-dasharray',o.dash);if(o.flow)o.el.setAttribute('stroke-dashoffset',(-(T*o.speed)%1000).toFixed(1))}
  }else{ /* dot */
   const p3=res(o.p),v=V(p3);
   if(o.n&&!facing(o.n,v)){hide(o);ord.push([-1e9+idx,o]);continue}
   let z=v[2];if(o.dp)z=V(res(o.dp))[2];
   ord.push([o.layer*100+z+o.sub*.001,o]);show(o);
   const p=P(v);const r=Math.max(1.1,o.r*S*p[2]);
   setA(o,'cx',p[0].toFixed(1));setA(o,'cy',p[1].toFixed(1));setA(o,'r',r.toFixed(2));setA(o,'fill',o.c);
   const bo=o.blink?(Math.sin(T*o.blink.sp+o.blink.ph)>-.25?1:.2):1;
   setA(o,'opacity',(bo*dimF).toFixed(2));
  }
 }
 ord.sort((a,b)=>a[0]-b[0]);
 let ch=sceneG.firstChild;
 for(const e of ord){const el=e[1].el;if(ch===el)ch=ch.nextSibling;else sceneG.insertBefore(el,ch)}

 /* etiquetas 3D de cotas */
 for(const l of labels){
  if(!st[l.group]){if(l.on!==false){l.el.style.display='none';l.on=false}continue}
  if(l.on===false){l.el.style.display='';l.on=true}
  const p=P(V(l.pos));l.el.setAttribute('x',p[0].toFixed(1));l.el.setAttribute('y',(p[1]+l.dy).toFixed(1));
 }
 /* hotspots */
 for(const h of HS){
  const v=V(h.a),p=P(v);
  let vis=1;if(h.n&&!facing(h.n,v))vis=.4;
  const act=sel===h||hov===h;
  h.g.setAttribute('transform','translate('+p[0].toFixed(1)+' '+p[1].toFixed(1)+')');
  h.g.setAttribute('opacity',sel&&sel!==h?vis*.65:vis);
  const ph=(T*9+h.i*2.3)%10;
  h.ring.setAttribute('r',(12+ph*(act?1.6:1)).toFixed(1));h.ring.setAttribute('stroke-opacity',(.35*(1-ph/10)).toFixed(2));
  h.dot.setAttribute('stroke-width',act?3:1.8);
  const showChip=st.labels||act;
  h.chip.style.display=showChip?'':'none';
  if(showChip){
   const side=p[0]>cx?1:-1,off=st.labels&&!act?-18-(h.i%4)*22:-30;
   const x=side>0?24:-24-h.w;
   h.chip.setAttribute('transform','translate('+p[0].toFixed(1)+' '+p[1].toFixed(1)+')');
   h.rect.setAttribute('x',x);h.rect.setAttribute('y',off);h.txt.setAttribute('x',x+10);h.txt.setAttribute('y',off+15);
   h.lead.setAttribute('d','M'+(side*11)+' '+(-4)+'L'+(side*24)+' '+(off+11));
   h.chip.setAttribute('opacity',vis<1?.55:1);
  }
 }
}

let last=performance.now(),rc=0;
function loop(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
 const k=1-Math.exp(-dt*5);
 if(!dragging){
  if(st.auto&&!gyro){cam.yaw+=dt*.2;tgt.yaw=cam.yaw}else if(!gyro)cam.yaw+=(tgt.yaw-cam.yaw)*k;
  for(const key of ['pitch','zoom','px','py','tx','ty','tz'])if(!gyro||key!=='pitch')cam[key]+=(tgt[key]-cam[key])*k;
 }
 doorAng+=(doorTarget-doorAng)*(1-Math.exp(-dt*4));
 doorG=doorGeoFn();
 render();
 if(++rc%8===0)$('#readout').innerHTML='Rotación '+Math.round(((cam.yaw*180/Math.PI)%360+360)%360)+'° · Inclinación '+Math.round(cam.pitch*180/Math.PI)+'° · Zoom '+cam.zoom.toFixed(2)+'×<br>Maqueta ilustrativa basada en los diagramas adjuntos';
 requestAnimationFrame(loop);
}
resize();build();doorG=doorGeoFn();renderPanel();syncBtns();
requestAnimationFrame(loop);
})();
</script>
</body>
